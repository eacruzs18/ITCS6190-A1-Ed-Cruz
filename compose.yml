services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secretpw
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # TODO: set DB_HOST, DB_PORT, DB_USER, DB_PASS and DB_NAME so that the app
      #       can reach the db service. DB_HOST is the Compose service name.
      APP_TOP_N: "10"
    volumes:
      - ./out:/out
